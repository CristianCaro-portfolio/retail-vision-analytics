name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest --cov=retail_vision --cov-report=term-missing
      - name: Simulation smoke run
        run: |
          rva simulate --frames 200 --output /tmp/events.jsonl > /tmp/sim.json
          rva report /tmp/events.jsonl > /tmp/report.json
          rva evaluate --frames 200 > /tmp/eval.json
          python -c "import json; r=json.load(open('/tmp/eval.json')); assert r['role_accuracy']>0.95, r"
