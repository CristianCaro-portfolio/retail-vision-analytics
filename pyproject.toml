[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-vision-analytics"
version = "0.1.0"
description = "Multi-camera retail analytics: person detection, tracking, cross-camera re-identification, employee identification and zone events with an edge-first pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cristian Caro" }]
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scipy>=1.10",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "httpx>=0.24",
]

[project.optional-dependencies]
cloud = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "duckdb>=0.9",
    "prometheus-client>=0.17",
]
models = [
    "ultralytics>=8.1",
    "onnxruntime>=1.16",
    "torch>=2.1",
    "torchvision>=0.16",
]
training = [
    "albumentations>=1.3",
    "ultralytics>=8.1",
    "torch>=2.1",
    "torchvision>=0.16",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "fastapi>=0.100",
    "duckdb>=0.9",
    "prometheus-client>=0.17",
    "albumentations>=1.3",
]

[project.scripts]
rva = "retail_vision.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
